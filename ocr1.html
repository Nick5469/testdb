<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 智能物品识别 - 拍照识物</title>
    <!-- TensorFlow.js 核心库和 MobileNet 模型适配器 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免移动端长按菜单 */
        }

        body {
            background: linear-gradient(145deg, #0a2f3a 0%, #0a1a1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 16px;
        }

        /* 主卡片 */
        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(22, 34, 38, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            padding: 20px 20px 30px;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            color: #f0f9ff;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 span {
            background: #ffb347;
            font-size: 1rem;
            padding: 4px 10px;
            border-radius: 60px;
            color: #1e2a2e;
            font-weight: 500;
        }

        .sub {
            text-align: center;
            color: #9bb7c2;
            font-size: 0.85rem;
            margin-bottom: 24px;
            border-bottom: 1px dashed #2e4a55;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 6px;
        }

        /* 相机预览区 */
        .camera-wrapper {
            background: #000000;
            border-radius: 36px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4 / 3;
            margin-bottom: 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 220, 150, 0.5);
        }

        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;  /* 隐藏canvas，仅用于截图处理 */
        }

        #videoElement {
            display: block;
        }

        /* 控制栏 */
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        button {
            background: #1e3b42;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 26px;
            border-radius: 60px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,215,140,0.4);
        }

        button:active {
            transform: scale(0.96);
            background: #0f2c32;
        }

        .btn-primary {
            background: #ff8c42;
            color: #1e2a2e;
            box-shadow: 0 6px 14px rgba(255,140,66,0.3);
        }

        .btn-primary:active {
            background: #e67e2e;
        }

        /* 识别结果卡片 */
        .result-card {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 200, 120, 0.4);
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffcd94;
            margin-bottom: 8px;
        }

        #resultText {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ffffff;
            word-break: break-word;
            line-height: 1.3;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
        }

        .confidence {
            font-size: 1rem;
            background: #2b5545;
            padding: 4px 12px;
            border-radius: 60px;
            font-weight: normal;
            color: #e6ffed;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #2d4e45;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,240,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 0.7rem;
            color: #7c9ba8;
        }

        @media (max-width: 500px) {
            .container {
                padding: 16px 16px 24px;
            }
            button {
                padding: 10px 20px;
                font-size: 1rem;
            }
            #resultText {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        📸 智感识物
        <span>AI 离线版</span>
    </h1>
    <div style="text-align: center;">
        <div class="sub">纯前端 · 手机对准物品 · 即时识别</div>
    </div>

    <!-- 摄像头预览区 -->
    <div class="camera-wrapper">
        <video id="videoElement" autoplay playsinline muted></video>
        <canvas id="canvasElement"></canvas>
    </div>

    <div class="controls">
        <button id="captureBtn" class="btn-primary">
            📷 拍照识别
        </button>
        <button id="restartCamBtn">
            🔄 重启摄像头
        </button>
    </div>

    <div class="result-card">
        <div class="result-label">🔍 识别结果</div>
        <div id="resultText">
            <span>等待拍照...</span>
        </div>
        <div class="footer-note">
            💡 提示：请将物品放在光线充足处，点击拍照识别。<br>
            🧠 模型基于 MobileNet，可识别上千种常见物体。
        </div>
    </div>
</div>

<script>
    // 全局变量
    let mobilenetModel = null;      // 存储模型
    let currentStream = null;       // 摄像头流
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const captureBtn = document.getElementById('captureBtn');
    const restartCamBtn = document.getElementById('restartCamBtn');
    const resultDiv = document.getElementById('resultText');

    // 辅助函数：显示加载状态
    function setLoadingState(isLoading, customMsg = null) {
        if (isLoading) {
            resultDiv.innerHTML = `<div class="loading"><div class="spinner"></div> 🧠 模型分析中...</div>`;
        } else if (customMsg) {
            resultDiv.innerHTML = `<span>${customMsg}</span>`;
        }
    }

    // 初始化摄像头
    async function initCamera() {
        // 关闭之前的流
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        try {
            // 适配移动端: 使用后置摄像头环境，优先 facingMode: environment
            const constraints = {
                video: {
                    facingMode: { exact: "environment" }, // 后置摄像头
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            
            // 如果不支持强制后置，就降级为普通后置或默认
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.warn("无法获取后置摄像头，尝试默认摄像头:", err);
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            
            currentStream = stream;
            video.srcObject = stream;
            await video.play();
            return true;
        } catch (error) {
            console.error("摄像头错误:", error);
            resultDiv.innerHTML = `<span>❌ 无法访问摄像头，请确保已授予权限并处于 HTTPS 环境</span>`;
            return false;
        }
    }

    // 加载 MobileNet 模型（只需要加载一次）
    async function loadModel() {
        if (mobilenetModel) return mobilenetModel;
        setLoadingState(true, '加载AI模型中...');
        try {
            // 注意：mobilenet.load() 会从 cdn 拉取约 20MB 权重文件，首次稍慢
            const model = await mobilenet.load({
                version: 2,
                alpha: 1.0
            });
            mobilenetModel = model;
            setLoadingState(false, '✅ 模型就绪，可以对准物品拍照啦！');
            setTimeout(() => {
                if (resultDiv.innerText.includes('模型就绪')) {
                    resultDiv.innerHTML = `<span>📸 点击拍照识别物品</span>`;
                }
            }, 2000);
            return model;
        } catch (err) {
            console.error("模型加载失败:", err);
            setLoadingState(false, '⚠️ 模型加载失败，请刷新页面重试');
            return null;
        }
    }

    // 核心：截取视频当前帧，识别物品
    async function recognizeFromVideo() {
        if (!mobilenetModel) {
            resultDiv.innerHTML = `<span>⏳ 模型尚未加载，请稍后再拍...</span>`;
            // 尝试重新加载
            await loadModel();
            if (!mobilenetModel) return;
        }
        
        if (!video.videoWidth || video.paused || video.ended) {
            resultDiv.innerHTML = `<span>📹 摄像头未就绪，请稍等或重启摄像头</span>`;
            return;
        }
        
        // 显示识别中状态
        setLoadingState(true);
        
        try {
            // 1. 将视频当前帧绘制到 canvas 并截图
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 2. 将 canvas 转为图片元素 或者直接传入HTMLImageElement
            const img = new Image(canvas.width, canvas.height);
            img.src = canvas.toDataURL('image/jpeg', 0.85);  // 转为 dataURL
            
            // 等待图片加载完成
            await new Promise((resolve) => {
                if (img.complete) resolve();
                else img.onload = resolve;
            });
            
            // 3. 调用 MobileNet 进行分类
            const predictions = await mobilenetModel.classify(img);
            
            if (predictions && predictions.length > 0) {
                const topPrediction = predictions[0];
                const className = topPrediction.className;      // 物品名称（英文居多但直观）
                const confidence = (topPrediction.probability * 100).toFixed(1);
                
                // 美化显示: 有的结果带英文下划线，可简单处理成更友好的文本（可选）
                let displayName = className;
                // 将常见的下划线或首字母大写转义 
                displayName = displayName.replace(/_/g, ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase());
                
                resultDiv.innerHTML = `
                    <span>✨ ${displayName}</span>
                    <span class="confidence">可信度 ${confidence}%</span>
                `;
            } else {
                resultDiv.innerHTML = `<span>🤔 未识别出明确物体，尝试换个角度或光线</span>`;
            }
        } catch (error) {
            console.error("识别错误:", error);
            resultDiv.innerHTML = `<span>⚠️ 识别出错，请重试或刷新页面</span>`;
        } finally {
            // 清除loading标记, 但如果里面已经是正常内容, 无需额外改变
            // 但注意 setLoadingState 改写了 html，如果识别成功已经覆盖，不能再次覆盖。
            // 为了避免冲突，这里不重置了，但识别失败时确保没卡loading:
            if (resultDiv.innerHTML.includes("分析中")) {
                resultDiv.innerHTML = `<span>😵 识别失败，请重新拍照</span>`;
            }
        }
    }

    // 重启摄像头（切换或恢复流）
    async function restartCamera() {
        setLoadingState(true, "🔄 正在重启摄像头...");
        await initCamera();
        setLoadingState(false, "📸 摄像头已重置，可继续拍照");
        setTimeout(() => {
            if (resultDiv.innerText.includes("摄像头已重置")) {
                resultDiv.innerHTML = `<span>📸 点击拍照识别物品</span>`;
            }
        }, 1800);
    }

    // 监听拍照按钮
    captureBtn.addEventListener('click', () => {
        // 如果模型还没加载好，先尝试加载再进行识别
        if (!mobilenetModel) {
            loadModel().then(() => {
                recognizeFromVideo();
            });
        } else {
            recognizeFromVideo();
        }
    });

    restartCamBtn.addEventListener('click', () => {
        restartCamera();
    });

    // 页面启动流程
    (async function bootstrap() {
        // 1. 开启摄像头
        const camOk = await initCamera();
        if (!camOk) {
            resultDiv.innerHTML = `<span>⚠️ 无法获取摄像头权限，请检查设置并刷新页面</span>`;
            return;
        }
        // 2. 后台加载模型（不阻塞UI, 显示loading）
        await loadModel();
        // 额外检测一下移动端需要用户手势才能播放某些浏览器，但通常 autoplay 加上 muted 无碍
        video.onloadedmetadata = () => {
            console.log("视频流已准备好");
        };
    })();
</script>
</body>
</html>
